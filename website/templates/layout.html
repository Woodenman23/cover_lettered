<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/styles.css') }}" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <title>{% block title %}Cover Lettered{% endblock %}</title>
  </head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('views.home') }}" class="nav-logo">
                <img src="{{ url_for('static', filename='images/scribe.jpg') }}" alt="Cover Lettered Logo" class="logo-img">
                <span class="logo-text">Cover Lettered</span>
            </a>
            <ul class="nav-menu">
                {% block navigation %}
                <li class="nav-item">
                    <a href="{{ url_for('views.home') }}" class="nav-link">Login</a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('views.home') }}" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('views.home') }}" class="nav-link">Create Account</a>
                </li>
                {% endblock %}
            </ul>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
